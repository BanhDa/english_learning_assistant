[project]
name = "study-bot"
version = "0.1.0"
description = "Trợ lý học tiếng Anh cá nhân trên Telegram, dùng Claude"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[job-queue]>=21.0",
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
    "tzdata>=2024.1",
    "httpx>=0.27.0",
    "Pillow>=10.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/study_bot"]
